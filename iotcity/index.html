   linear-gradient(var(--c),var(--c)) right bottom/12px 1.5px no-repeat,linear-gradient(var(--c),var(--c)) right bottom/1.5px 12px no-repeat}
.card-luz{position:absolute;inset:0;border-radius:inherit;pointer-events:none;overflow:hidden}.card-luz:before{content:"";position:absolute;top:-50%;bottom:-50%;left:-70%;width:45%;transform:skewX(-22deg);background:linear-gradient(90deg,transparent,rgba(150,235,255,.26),transparent)}

<script>
(()=>{'use strict';
/* IOT CITY — três modos de entrada:
   · apresentação: divulgação da plataforma (público)
   · visitante: serviços abertos ao público da cidade configurada
   · cliente: login do portal → botões dos sistemas da cidade (cada sistema mantém o PRÓPRIO login)
   Quem vê o quê é decidido no banco (RLS): o navegador só recebe o que pode mostrar. */
const $=id=>document.getElementById(id);
const SB=window.supabase?window.supabase.createClient(IOT_SUPA.url,IOT_SUPA.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}}):null;
let CFG={titulo:'IOT CITY',marca_sub:'SMART CITIES PLATFORM',eyebrow:'',legenda:'',menu_lateral:'oculto',rotacao_auto:true,velocidade:1,ampliacao:1.3,mostrar_kpis:true,kpis:[],rodape:'',
  cidade_nome:'',cidade_lat:null,cidade_lon:null,mostrar_alfinete:true,visitante_texto:'',mkt_titulo:'A Plataforma para controlar os dispositivos e sistemas na sua cidade e empresa.',mkt_destaque:'Tudo em um só portal.',
  mkt_itens:['Controle','Organização','Apresentação','Personalização'],mkt_cta:'CONTRATE AGORA',mkt_nota:'Simples de configurar.',contato_whatsapp:null,contato_email:null,contato_mensagem:''};
let TODOS=[],APPS=[],MODO='apresentacao',PAPEL=null,SESSAO=null,FALHOU=false;
const stage=$('stage'),container=$('cards'),dots=$('dots'),search=$('search'),appEl=$('app');
const circle=2*Math.PI;let angle=0.17,auto=true,hover=-1,destaque=-1,destaqueAte=0,drag=false,ptr=-1,prevX=0,total=0,velocity=0,freeVelocity=0,lastTime=performance.now(),gestureIndex=-1,initialAngle=angle,alvo=null;
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
let nodes=[],dotnodes=[];
const esc=s=>(s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ICO={zap:'<svg viewBox="0 0 24 24"><path d="M3 21l1.6-4.8A8.5 8.5 0 1 1 8 19.6Z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1.3-1.4-2-1-1 .8a4 4 0 0 1-2.2-2.2l.8-1-1-2Z"/></svg>',
  mail:'<svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="m3 6 9 7 9-7"/></svg>'};

/* ---------- abrir botão ---------- */
function urlSegura(u){ return typeof u==='string' && (/^https?:\/\/[a-z0-9.-]+(:\d{1,5})?([/?#].*)?$/i.test(u) || /^\/(?!\/)/.test(u)); }
function abrir(i){ const a=APPS[i]; if(!a) return;
  if(a.exibicao==='bloqueado') return dialogo(a.nome, a.mensagem_bloqueio || 'Este item não está disponível no momento.');
  if(urlSegura(a.url)){ if(a.abrir_em==='mesma') location.href=a.url; else window.open(a.url,'_blank','noopener'); return; }
  if(a.saiba_mais||MODO==='apresentacao') return saibaMais(a);
  dialogo(a.nome,'O endereço deste sistema ainda não foi configurado.');
}
function saibaMais(a){
  janela('SAIBA MAIS',a.nome,'<p>'+esc(a.saiba_mais||a.descricao||'')+'</p><div class="acoes"><button type="button" id="jCta">'+esc(CFG.mkt_cta||'CONTRATE AGORA')+'</button><button type="button" class="sec" id="jVoltar">Voltar</button></div>');
  $('jCta').onclick=contratar; $('jVoltar').onclick=fecharDialogo; }
function contratar(){
  const msg=CFG.contato_mensagem||'Olá! Quero conhecer a plataforma IOT CITY.';
  const zap=CFG.contato_whatsapp?'https://wa.me/'+encodeURIComponent(CFG.contato_whatsapp)+'?text='+encodeURIComponent(msg):null;
  const mail=CFG.contato_email?'mailto:'+CFG.contato_email+'?subject='+encodeURIComponent('IOT CITY — quero contratar')+'&body='+encodeURIComponent(msg):null;
  janela('IOT CITY • VYONX',CFG.mkt_cta||'Contrate agora',
    '<p>'+esc(CFG.mkt_titulo||'')+(CFG.mkt_nota?'\n'+esc(CFG.mkt_nota):'')+'</p>'+
    (zap||mail?'<div class="acoes">'+(zap?'<a class="zap" href="'+esc(zap)+'" target="_blank" rel="noopener">'+ICO.zap+'WhatsApp</a>':'')+(mail?'<a href="'+esc(mail)+'">'+ICO.mail+'E-mail</a>':'')+'</div>'
      :'<p class="fino">Os canais de contato estão sendo configurados. Volte em breve.</p>')); }

/* ---------- montagem da órbita ---------- */
const tipoCard=a=>a.exibicao==='bloqueado'?'bloq':urlSegura(a.url)?'link':'info';
function cardHTML(a,i){ const t=tipoCard(a);
  return '<span class="card-luz"></span><div class="card-icon">'+iotIcone(a.icone)+'</div><div class="card-copy"><div class="card-title"></div><div class="card-info"></div>'+
    '<div class="card-tag"><span class="led"></span><span class="num">'+String(i+1).padStart(2,'0')+'</span>'+({bloq:'Em breve',link:'Acessar',info:'Saiba mais'}[t])+'</div></div>'+
    '<span class="enter-icon" title="'+({bloq:'Indisponível',link:'Abrir',info:'Saiba mais'}[t])+'">'+({bloq:'🔒︎',link:'↗',info:'+'}[t])+'</span>'; }
function preencher(el,a){ el.querySelector('.card-title').textContent=a.nome; el.querySelector('.card-info').textContent=a.descricao||''; }
const classeCard=a=>'orbit-card'+({bloq:' bloq',link:'',info:' info'}[tipoCard(a)]);
function montar(){
  container.innerHTML=''; dots.innerHTML=''; $('nav').innerHTML=''; $('gradeLista').innerHTML=''; hover=-1; destaque=-1;
  nodes=APPS.map((a,i)=>{
    const b=document.createElement('button');b.type='button';b.className=classeCard(a);b.dataset.idx=i;
    b.setAttribute('aria-label',(a.exibicao==='bloqueado'?'Indisponível: ':'Abrir ')+a.nome);b.innerHTML=cardHTML(a,i);preencher(b,a);
    b.addEventListener('pointerenter',e=>{if(!drag&&e.pointerType!=='touch')hover=i;});
    b.addEventListener('pointerleave',()=>{if(!drag&&hover===i)hover=-1;});
    b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();abrir(i);}});
    container.appendChild(b);
    // menu lateral: MESMA lista e mesma ordem da órbita
    const n=document.createElement('button');n.type='button';n.className='nav-btn'+(a.exibicao==='bloqueado'?' bloq':'');n.title=a.nome+(a.descricao?' — '+a.descricao:'');
    n.innerHTML='<span class="navico">'+iotIcone(a.icone)+'</span><span class="nav-label"></span>'+(a.exibicao==='bloqueado'?'<span class="nav-lock">🔒︎</span>':'');
    n.querySelector('.nav-label').textContent=a.nome; n.addEventListener('click',()=>focar(i)); $('nav').appendChild(n);
    const g=document.createElement('button');g.type='button';g.className=classeCard(a);g.innerHTML=cardHTML(a,i);preencher(g,a);g.addEventListener('click',()=>abrir(i));$('gradeLista').appendChild(g);
    const s=document.createElement('span');dots.appendChild(s);
    return {b,n,scale:.76};
  });
  dotnodes=[...dots.children];
  const v=$('vazio'); v.style.display=APPS.length?'none':'block';
  v.textContent=FALHOU?'Não foi possível carregar o portal agora. Tente novamente em instantes.':{apresentacao:'Nenhum destaque configurado ainda.',visitante:'Nenhum serviço aberto ao público ainda.',cliente:'Nenhum sistema configurado ainda.'}[MODO];
  $('prev').style.display=$('next').style.display=APPS.length>1?'':'none';
}
/* gira a órbita até o cartão e o destaca (sincronização menu lateral → órbita) */
function focar(i){ const N=APPS.length; if(!N) return;
  const duas=N>12, M=duas?Math.ceil(N/2):N, k=duas?Math.floor(i/2):i, off=duas&&i%2?circle/M/2:0;
  let t=-(k*circle/M+off); const d=((t-angle)%circle+circle*1.5)%circle-circle/2; alvo=angle+d;
  destaque=i; destaqueAte=performance.now()+3500; freeVelocity=0; fecharGrade();
  nodes.forEach((x,k)=>x.n.classList.toggle('active',k===i)); }
function layout(dt){
  const N=APPS.length; if(!N) return;
  const w=stage.clientWidth,h=stage.clientHeight, duas=N>12;
  const xc=w/2,yc=h*.49, world=$('world').getBoundingClientRect(), raioTerra=world.width*.47;
  const q=search.value.trim().toLocaleLowerCase('pt-BR');
  const agora=performance.now(); if(destaque>=0&&agora>destaqueAte&&hover!==destaque){ destaque=-1; nodes.forEach(x=>x.n.classList.remove('active')); }
  nodes.forEach((entry,i)=>{
    const anel=duas?i%2:0, k=duas?Math.floor(i/2):i, M=duas?Math.ceil(N/2):N;
    const rx=Math.min(w*.35,480)*(anel?.72:1), ry=Math.min(h*.275,168)*(anel?.7:1);
    const t=angle+k*circle/M+(anel?circle/M/2:0);
    const depth=Math.cos(t),x=xc+Math.sin(t)*rx,y=yc+depth*ry;
    const hit=hover===i||destaque===i, base=.69+(.27*(depth+1)/2)*(anel?.92:1);
    const target=base*(hit?CFG.ampliacao:1);
    entry.scale+=(target-entry.scale)*Math.min(1,dt*.21);
    const el=entry.b, z=hit?115:Math.round(55+45*depth);
    el.style.left=x+'px';el.style.top=y+'px';
    el.style.transform='translate(-50%,-50%) perspective(900px) rotateY('+(-Math.sin(t)*15)+'deg) rotateX('+(-depth*3)+'deg) scale('+entry.scale+')';
    el.style.zIndex=String(z);
    el.style.opacity=String(hit?1:(.5+((depth+1)/2)*.5));
    el.classList.toggle('hovered',hit);
    // atrás da Terra (camada abaixo do globo e sobre o disco): sem clique
    const atras=z<60&&Math.abs(x-xc)<raioTerra*.95; el.classList.toggle('atras',atras); el.tabIndex=atras?-1:0;
    const a=APPS[i], muted=q&&!((a.nome+' '+(a.descricao||'')+' '+(a.categoria||'')).toLocaleLowerCase('pt-BR').includes(q));
    el.classList.toggle('search-muted',Boolean(muted));
  });
  const front=Math.round(((circle-(angle%circle)+circle)%circle)/circle*N)%N;
  dotnodes.forEach((d,i)=>d.classList.toggle('selected',i===front));
  // feixe: da borda do globo até o cartão em destaque (só se ele estiver na frente)
  const alvoI=hover>=0?hover:destaque, L=$('feixeL'), P=$('feixeP'), cardA=alvoI>=0&&nodes[alvoI]?nodes[alvoI].b:null;
  if(cardA&&!cardA.classList.contains('atras')&&!cardA.classList.contains('bloq')){
    const sr=stage.getBoundingClientRect(), gx=world.left+world.width/2-sr.left, gy=world.top+world.height/2-sr.top;
    const cx=parseFloat(cardA.style.left), cy=parseFloat(cardA.style.top), d=Math.hypot(cx-gx,cy-gy)||1;
    const x1=gx+(cx-gx)/d*raioTerra*.98, y1=gy+(cy-gy)/d*raioTerra*.98;
    L.setAttribute('x1',x1);L.setAttribute('y1',y1);L.setAttribute('x2',cx);L.setAttribute('y2',cy);L.setAttribute('visibility','visible');
    const gr=$('gFeixe'); gr.setAttribute('x1',x1);gr.setAttribute('y1',y1);gr.setAttribute('x2',cx);gr.setAttribute('y2',cy);
    P.setAttribute('cx',x1);P.setAttribute('cy',y1);P.setAttribute('visibility','visible');
  } else { L.setAttribute('visibility','hidden'); P.setAttribute('visibility','hidden'); }
}

/* ---------- janelas ---------- */
function janela(eyebrow,title,html){ $('modalEyebrow').textContent=eyebrow; $('modalTitle').textContent=title; $('modalBody').innerHTML=html; $('modal').classList.add('visible'); }
function dialogo(title,msg){ janela('IOT CITY • VYONX',title,'<p>'+esc(msg)+'</p><div class="acoes"><button type="button" id="jOk">Voltar ao IOT CITY</button></div>'); $('jOk').onclick=fecharDialogo; }
function fecharDialogo(){ $('modal').classList.remove('visible'); }
$('modalClose').addEventListener('click',fecharDialogo);$('modal').addEventListener('click',e=>{if(e.target.id==='modal')fecharDialogo()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){fecharDialogo();fecharGrade();$('contaMenu').classList.remove('aberto');}});

/* ---------- login do cliente ---------- */
function telaLogin(msg){
  janela('ÁREA DO CLIENTE','Entrar',
    '<p>Acesse com seu e-mail e senha.</p><form class="form" id="fLogin"><label>E-mail<input id="lEmail" type="email" autocomplete="username" required></label>'+
    '<label>Senha<input id="lSenha" type="password" autocomplete="current-password" required></label><div class="erro" id="lErro"></div><button class="entrar" type="submit" id="lBtn">Entrar</button></form>'+
    '<p class="fino">O login do portal mostra os sistemas da sua cidade. Cada sistema continua pedindo o próprio acesso.</p>');
  if(msg){ $('lErro').textContent=msg; $('lErro').classList.add('on'); }
  setTimeout(()=>$('lEmail').focus(),30);
  $('fLogin').onsubmit=async e=>{ e.preventDefault(); const bt=$('lBtn'); bt.disabled=true; bt.textContent='Entrando…'; $('lErro').classList.remove('on');
    const {error}=await SB.auth.signInWithPassword({email:$('lEmail').value.trim(),password:$('lSenha').value});
    if(error){ bt.disabled=false; bt.textContent='Entrar'; $('lErro').textContent=/invalid/i.test(error.message)?'E-mail ou senha inválidos.':error.message; $('lErro').classList.add('on'); return; }
    await lerSessao();
    if(!PAPEL){ await SB.auth.signOut(); SESSAO=null; bt.disabled=false; bt.textContent='Entrar'; $('lErro').textContent='Este login não tem acesso ao portal desta cidade.'; $('lErro').classList.add('on'); return; }
    fecharDialogo(); await carregar(); trocarModo('cliente'); };
}
function telaSenha(){
  janela('ÁREA DO CLIENTE','Alterar senha','<form class="form" id="fSenha"><label>Nova senha (mínimo 8 caracteres)<input id="s1" type="password" autocomplete="new-password" minlength="8" required></label>'+
    '<label>Repita a nova senha<input id="s2" type="password" autocomplete="new-password" minlength="8" required></label><div class="erro" id="sErro"></div><button class="entrar" type="submit">Salvar nova senha</button></form>');
  $('fSenha').onsubmit=async e=>{ e.preventDefault(); const er=$('sErro'); er.classList.remove('on');
    if($('s1').value!==$('s2').value){ er.textContent='As senhas não conferem.'; er.classList.add('on'); return; }
    const {error}=await SB.auth.updateUser({password:$('s1').value});
    if(error){ er.textContent=error.message; er.classList.add('on'); return; }
    $('modalBody').innerHTML='<div class="ok">Senha alterada.</div>'; setTimeout(fecharDialogo,1400); };
}
async function lerSessao(){
  PAPEL=null; SESSAO=null; if(!SB) return;
  const {data}=await SB.auth.getSession(); SESSAO=data.session;
  if(SESSAO){ const {data:p}=await SB.rpc('portal_papel'); PAPEL=p||null; }
  $('contaEmail').textContent=SESSAO?SESSAO.user.email:''; $('mAdmin').hidden=PAPEL!=='admin';
}

/* ---------- modos ---------- */
function filtrar(){ APPS=TODOS.filter(a=>(a.modos||['cliente']).includes(MODO)); }
function trocarModo(m){
  if(m==='cliente'&&!PAPEL) return telaLogin();
  MODO=m; try{ sessionStorage.setItem('iotcity-modo',m); }catch(_){}
  appEl.classList.remove('modo-apresentacao','modo-visitante','modo-cliente'); appEl.classList.add('modo-'+m);
  appEl.classList.toggle('com-cidade',m!=='apresentacao'&&!!CFG.cidade_nome);
  $('btnVisitante').classList.toggle('on',m==='visitante'); $('btnCliente').classList.toggle('on',m==='cliente');
  $('sideTit').textContent={apresentacao:'DESTAQUES',visitante:'SERVIÇOS ABERTOS',cliente:'SISTEMAS'}[m];
  $('gradeTit').textContent={apresentacao:'Destaques da plataforma',visitante:'Serviços abertos ao público',cliente:'Sistemas da '+(CFG.cidade_nome||'cidade')}[m];
  search.value=''; search.placeholder=m==='visitante'?'Buscar serviço…':'Buscar sistema…';
  filtrar(); montar(); cabecalho(); fecharGrade(); angle=initialAngle; alvo=null;
}
function cabecalho(){
  const h=$('heading');
  if(MODO==='apresentacao'){
    h.innerHTML='<div class="mkt">'+(CFG.eyebrow?'<div class="eyebrow">'+esc(CFG.eyebrow)+'</div>':'')+'<h2>'+esc(CFG.mkt_titulo||'')+'</h2>'+
      (CFG.mkt_destaque?'<p class="destaque">'+esc(CFG.mkt_destaque)+'</p>':'')+
      ((CFG.mkt_itens||[]).length?'<ul>'+CFG.mkt_itens.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul>':'')+
      '<div class="cta-linha"><button type="button" class="cta" id="cta">'+esc(CFG.mkt_cta||'CONTRATE AGORA')+'</button>'+(CFG.mkt_nota?'<span class="nota">'+esc(CFG.mkt_nota)+'</span>':'')+'</div></div>';
    $('cta').onclick=contratar;
  } else if(MODO==='visitante'){
    h.innerHTML='<div class="eyebrow">VISITANTE · SERVIÇOS ABERTOS AO PÚBLICO</div><p class="caption"></p>'; h.querySelector('.caption').textContent=CFG.visitante_texto||'';
  } else {
    h.innerHTML='<div class="eyebrow"></div><p class="caption"></p>'; h.firstChild.textContent=CFG.eyebrow||'ÁREA DO CLIENTE'; h.querySelector('.caption').textContent=CFG.legenda||'';
  }
  const k=$('kpis'); k.innerHTML='';
  if(CFG.mostrar_kpis&&MODO!=='apresentacao'){ const n=APPS.filter(a=>a.exibicao==='visivel').length;
    const lista=[...(n?[{v:String(n).padStart(2,'0'),l:MODO==='visitante'?'Serviços disponíveis':'Sistemas disponíveis'}]:[]),...(Array.isArray(CFG.kpis)?CFG.kpis:[])];
    lista.slice(0,3).forEach(x=>{ const d=document.createElement('div'); d.className='kpi'; d.innerHTML='<div class="kvalue"></div><div class="klabel"></div>'; d.firstChild.textContent=x.v||''; d.lastChild.textContent=x.l||''; k.appendChild(d); }); }
}
$('brand').addEventListener('click',()=>trocarModo('apresentacao'));
$('btnVisitante').addEventListener('click',()=>trocarModo(MODO==='visitante'?'apresentacao':'visitante'));
$('btnCliente').addEventListener('click',e=>{ e.stopPropagation(); if(!PAPEL) return telaLogin(); if(MODO!=='cliente') return trocarModo('cliente'); $('contaMenu').classList.toggle('aberto'); });
document.addEventListener('click',e=>{ if(!e.target.closest('.conta')) $('contaMenu').classList.remove('aberto'); });
$('mSistemas').onclick=()=>{ $('contaMenu').classList.remove('aberto'); trocarModo('cliente'); };
$('mSenha').onclick=()=>{ $('contaMenu').classList.remove('aberto'); telaSenha(); };
$('mSair').onclick=async()=>{ $('contaMenu').classList.remove('aberto'); await SB.auth.signOut(); PAPEL=null; SESSAO=null; await carregar(); trocarModo('apresentacao'); };

/* ---------- controles da órbita ---------- */
function updateAuto(){ $('autoplay').textContent=auto?'Ⅱ Pausar rotação':'▷ Iniciar rotação'; }
stage.addEventListener('pointerdown',e=>{
  if(e.button!==0||e.target.closest('.turn'))return;
  ptr=e.pointerId;drag=true;prevX=e.clientX;total=0;velocity=0;freeVelocity=0;alvo=null;
  const c=e.target.closest('.orbit-card'); gestureIndex=Number(c&&!c.classList.contains('atras')?c.dataset.idx:-1);
  if(c)e.preventDefault(); stage.setPointerCapture(ptr);stage.classList.add('grabbing');hover=-1;
});
stage.addEventListener('pointermove',e=>{ if(!drag||e.pointerId!==ptr)return; const dx=e.clientX-prevX;prevX=e.clientX;total+=Math.abs(dx);velocity=dx*.0065;angle+=velocity; });
function endDrag(e){ if(!drag||e.pointerId!==ptr)return;
  drag=false;stage.classList.remove('grabbing');freeVelocity=(total>6)?velocity:0;
  if(stage.hasPointerCapture(ptr))stage.releasePointerCapture(ptr);
  if(total<=7&&gestureIndex>=0)abrir(gestureIndex);
  gestureIndex=-1;ptr=-1;setTimeout(()=>total=0,50); }
stage.addEventListener('pointerup',endDrag);stage.addEventListener('pointercancel',endDrag);
stage.addEventListener('pointerleave',()=>{if(!drag)hover=-1;});
const rotateStep=d=>{ const N=Math.max(1,APPS.length), M=N>12?Math.ceil(N/2):N; alvo=(alvo??angle)+d*circle/M; hover=-1; freeVelocity=0; };
$('prev').addEventListener('click',()=>rotateStep(-1));$('next').addEventListener('click',()=>rotateStep(1));
$('autoplay').addEventListener('click',()=>{auto=!auto;freeVelocity=0;updateAuto()});
$('restart').addEventListener('click',()=>{alvo=null;angle=initialAngle;hover=-1;destaque=-1;freeVelocity=0;search.value='';auto=CFG.rotacao_auto&&!reduceMotion;updateAuto()});
stage.addEventListener('keydown',e=>{ if(e.target!==stage)return; if(e.key==='ArrowRight'){rotateStep(1);e.preventDefault()} else if(e.key==='ArrowLeft'){rotateStep(-1);e.preventDefault()} });
search.addEventListener('keydown',e=>{ if(e.key==='Enter'&&search.value.trim()){ const q=search.value.trim().toLocaleLowerCase('pt-BR');
  const i=APPS.findIndex(a=>(a.nome+' '+(a.descricao||'')+' '+(a.categoria||'')).toLocaleLowerCase('pt-BR').includes(q)); if(i>=0){focar(i);stage.focus();} } });
// menu lateral: oculto / recolhido / expandido (o usuário alterna; padrão vem da configuração)
const MENUS=['oculto','expandido','recolhido'];
function menu(m){ appEl.classList.remove('menu-oculto','menu-recolhido','menu-expandido'); appEl.classList.add('menu-'+m); $('btnMenu').classList.toggle('on',m!=='oculto'); try{localStorage.setItem('iotcity-menu',m)}catch(_){} }
$('btnMenu').addEventListener('click',()=>{ const at=MENUS.find(m=>appEl.classList.contains('menu-'+m))||'oculto'; menu(MENUS[(MENUS.indexOf(at)+1)%3]); });
function fecharGrade(){ $('grade').classList.remove('visible'); $('btnGrade').classList.remove('on'); }
$('btnGrade').addEventListener('click',()=>{ const v=$('grade').classList.toggle('visible'); $('btnGrade').classList.toggle('on',v); });
function frame(now){ const dt=Math.min((now-lastTime)/16.667,2.5); lastTime=now;
  if(!drag&&!$('modal').classList.contains('visible')){
    if(alvo!==null){ const d=alvo-angle; if(Math.abs(d)<.002){angle=alvo;alvo=null;} else angle+=d*Math.min(1,.12*dt); }
    else if(hover<0&&destaque<0){ if(Math.abs(freeVelocity)>.00007){angle+=freeVelocity*dt;freeVelocity*=Math.pow(.95,dt)} else if(auto){angle+=.00175*CFG.velocidade*dt} }
  }
  layout(dt); requestAnimationFrame(frame); }

/* ---------- configuração e dados ---------- */
function aplicarConfig(){
  const t=(CFG.titulo||'IOT CITY').trim(), p=t.split(/\s+/); const h=$('titulo'); h.textContent=p[0]+' ';
  if(p.length>1){ const s=document.createElement('span'); s.textContent=p.slice(1).join(' '); h.appendChild(s); }
  document.title=t+(CFG.cidade_nome?' · '+CFG.cidade_nome:'')+' | VYONX'; $('marcaSub').textContent=CFG.marca_sub||''; $('rodape').textContent=CFG.rodape||'';
  $('cidadeNome').textContent=CFG.cidade_nome||'';
  let m=CFG.menu_lateral; try{ m=localStorage.getItem('iotcity-menu')||m; }catch(_){} menu(MENUS.includes(m)?m:'oculto');
  auto=CFG.rotacao_auto&&!reduceMotion; updateAuto();
}
async function carregar(){
  FALHOU=false;
  try{
    if(!SB) throw new Error('supabase-js não carregou');
    const [ra,rc]=await Promise.all([
      SB.from('portal_app').select('id,nome,descricao,icone,url,abrir_em,exibicao,mensagem_bloqueio,saiba_mais,categoria,ordem,modos').neq('exibicao','oculto').order('ordem').order('id'),
      SB.from('portal_config').select('*').eq('id',1).maybeSingle()]);
    if(ra.error) throw ra.error;
    TODOS=ra.data||[]; if(rc.data) CFG=Object.assign(CFG,rc.data);
  }catch(err){ console.warn('IOT CITY: falha ao carregar',err); TODOS=[]; FALHOU=true; }
  aplicarConfig();
}
(async()=>{
  try{ await lerSessao(); }catch(_){}
  await carregar();
  let m='apresentacao'; try{ m=sessionStorage.getItem('iotcity-modo')||m; }catch(_){}
  if(location.hash==='#cliente') m='cliente'; else if(location.hash==='#visitante') m='visitante';
  // logado volta para a área do cliente; sem login, #cliente abre a caixa de login sobre a apresentação
  if(m==='cliente'&&!PAPEL){ trocarModo('apresentacao'); if(location.hash==='#cliente') telaLogin(); }
  else trocarModo(m);
  requestAnimationFrame(frame); setTimeout(()=>appEl.classList.add('pronto'),60);
})();
window.IOTCity={focar,getAngle:()=>angle,apps:()=>APPS.map(a=>a.nome),modo:()=>MODO,trocarModo};
})();
</script>
